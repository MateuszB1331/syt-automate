<!DOCTYPE html>

  <style>

    .item input[type="checkbox"] { margin-top: 3px; width: 18px; height: 18px; accent-color: #6d3fd1; flex-shrink: 0; cursor: pointer; }

<body>
  <div class="card">
    <p style="font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#6d3fd1;margin:0 0 12px;">Free checklist</p>

    <div class="item"><input type="checkbox" id="c8"><label for="c8">Onboarding new clients or staff using the same set of repeated steps every time</label></div>
    <div class="item"><input type="checkbox" id="c9"><label for="c9">Manually posting or scheduling content across multiple platforms</label></div>
