[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# API proxy — must come before the SPA catch-all
[[redirects]]
  from = "/api/qualify"
  to = "/.netlify/functions/qualify"
  status = 200
  force = true

# SPA catch-all
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
